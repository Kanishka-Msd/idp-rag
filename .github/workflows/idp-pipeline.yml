name: IDP Pipeline CI

on:
  push:
    branches:
      - main

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pdfplumber
          pip install faiss-cpu numpy groq httpx
          pip install sentence-transformers

      - name: Validate imports
        run: |
          python -c "import fastapi; print('✅ FastAPI OK')"
          python -c "import pdfplumber; print('✅ PDF Parser OK')"
          python -c "import faiss; print('✅ FAISS OK')"
          python -c "import groq; print('✅ Groq OK')"
          python -c "from sentence_transformers import SentenceTransformer; print('✅ Embeddings OK')"

      - name: Validate API structure
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          # Check all required files exist
          import os
          required = ['app/main.py', 'app/streamlit_app.py', 'Dockerfile', 'requirements.txt']
          for f in required:
              assert os.path.exists(f), f'Missing: {f}'
              print(f'✅ {f} exists')
          print('✅ All required files present!')
          "

      - name: Run evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python eval/evaluate.py || echo "⚠️ No invoices to evaluate yet"

      - name: Check API health
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          curl https://idp-rag.onrender.com/health || echo "⚠️ API check skipped"